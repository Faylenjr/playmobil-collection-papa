name: Apply nightly import workflow

on:
  push:
    branches:
      - main
    paths:
      - "0001-feat-run-full-catalogue-import-in-sequential-batches.patch"
      - ".github/workflows/apply-nightly-import.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'Faylenjr'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am 0001-feat-run-full-catalogue-import-in-sequential-batches.patch
          git rm 0001-feat-run-full-catalogue-import-in-sequential-batches.patch
          git rm .github/workflows/apply-nightly-import.yml
          git commit -m "chore: remove staged nightly import patch"
          git push origin HEAD:main
