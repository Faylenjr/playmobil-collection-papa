name: Apply staged phase zero commits

on:
  push:
    branches: [main]
    paths:
      - "0001-feat-model-variant-level-catalogue-data.patch"
      - "0002-feat-add-resumable-catalogue-importers.patch"
      - "0003-docs-publish-measured-phase-zero-sample.patch"
      - ".github/workflows/apply-phase-zero.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'Faylenjr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed commits
        run: |
          git config user.name "Faylen"
          git config user.email "54444902+Faylenjr@users.noreply.github.com"
          git am 0001-feat-model-variant-level-catalogue-data.patch
          git am 0002-feat-add-resumable-catalogue-importers.patch
          git am 0003-docs-publish-measured-phase-zero-sample.patch
          git rm 0001-feat-model-variant-level-catalogue-data.patch
          git rm 0002-feat-add-resumable-catalogue-importers.patch
          git rm 0003-docs-publish-measured-phase-zero-sample.patch
          git rm .github/workflows/apply-phase-zero.yml
          git commit -m "chore: remove staged phase zero patches"
          git push origin HEAD:main
