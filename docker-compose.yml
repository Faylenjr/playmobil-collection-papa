services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: playmobil
      POSTGRES_USER: playmobil
      POSTGRES_PASSWORD: playmobil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playmobil -d playmobil"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: .
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://playmobil:playmobil@postgres:5432/playmobil
      DIRECT_URL: postgresql://playmobil:playmobil@postgres:5432/playmobil
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    command: ["pnpm", "start", "--hostname", "0.0.0.0"]
    environment:
      DATABASE_URL: postgresql://playmobil:playmobil@postgres:5432/playmobil
      DIRECT_URL: postgresql://playmobil:playmobil@postgres:5432/playmobil
      KELKOO_PUBLISHER_TOKEN: ${KELKOO_PUBLISHER_TOKEN:-}
      KELKOO_COUNTRY: ${KELKOO_COUNTRY:-fr}
      EBAY_ENVIRONMENT: ${EBAY_ENVIRONMENT:-sandbox}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
      EBAY_MARKETPLACE_ID: ${EBAY_MARKETPLACE_ID:-EBAY_FR}
      EBAY_DELIVERY_POSTAL_CODE: ${EBAY_DELIVERY_POSTAL_CODE:-}
      EBAY_ACCOUNT_DELETION_ENDPOINT: ${EBAY_ACCOUNT_DELETION_ENDPOINT:-}
      EBAY_ACCOUNT_DELETION_VERIFICATION_TOKEN: ${EBAY_ACCOUNT_DELETION_VERIFICATION_TOKEN:-}
    ports:
      - "3003:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
